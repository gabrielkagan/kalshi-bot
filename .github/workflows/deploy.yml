name: Deploy to VPS

on:
  push:
    branches: [main]

# Serialize VPS-touching workflows (deploy + install_h4_cron) so they
# can't race on ~/kalshi-bot-repo working tree. cancel-in-progress=false
# means we wait rather than kill an in-flight deploy mid-pull.
concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e '.[dev]'
      - name: Syntax check
        run: python3 -c "import ast; ast.parse(open('bot/_impl.py').read()); ast.parse(open('bot/constants.py').read())"
      # Pillar 5 (testing-foundation-sprint, ticket 86b9ve11y): same
      # tiered layout as test.yml but integration is BLOCKING here
      # (no continue-on-error). Deploy is the higher-stakes gate —
      # an integration regression should abort deploy even if the PR
      # gate let it through.
      - name: Unit tier (Pillar 5)
        run: make test-unit
      # Contract tier split into two distinct CI steps (ticket
      # 86b9vgh3t). Mirrors test.yml's split — see comments there.
      # Both halves are BLOCKING on deploy (no continue-on-error) so
      # a contract regression aborts the VPS push regardless of
      # which half failed.
      - name: Contract tier — pytest
        run: make test-contract-pytest
      - name: Contract tier — import-linter
        run: make test-contract-lint
      - name: Equivalence tier (Pillar 3)
        # Same fast-failing guardrail before the broad integration
        # tier. Direct pushes to main (whitepaper auto-commit, operator
        # hotfix) skip test.yml's pull_request gate, so this step has
        # to be in deploy.yml too — otherwise an engine-output drift
        # could ride a hotfix straight to the VPS.
        run: make test-equivalence
      - name: Integration tier (Pillar 5 — BLOCKING on deploy)
        # Mirrors test.yml's integration step but without
        # continue-on-error. Deploy gate, last chance to catch a
        # behavioral regression before the VPS pulls.
        run: make test-integration

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: botuser
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/kalshi-bot-repo
            # Pin to the exact commit that triggered this deploy. `git pull`
            # races with parallel auto-commits (whitepaper.yml pushes [skip ci]
            # PDFs). `reset --hard` to ${{ github.sha }} stays on `main` (no
            # detached HEAD for VPS-side cron / start.sh assumptions) and
            # blasts through any dirty tree.
            git fetch origin main
            git checkout main
            # Pre-deploy: verify on-VPS systemd unit matches ops/kalshi-bot.service
            # at the deploy commit. If drift, abort BEFORE reset --hard so VPS
            # stays on the prior commit. Bit 2.0.5.2 of repo modularization plan
            # (kb/decisions/repo-modularization-plan-may05.md). Compares against
            # `git show ${{ github.sha }}:...` (the deploy-commit file) rather
            # than working-tree, which is still the PRIOR commit's content here
            # (git checkout main doesn't advance HEAD before reset --hard).
            # Filter `^# /(etc|run|usr/lib)/` strips systemd-cat path headers
            # from /etc, /run, /usr/lib drop-in dirs (allowlist — broader
            # `^# /` would also strip body comments matching `# /opt/...`,
            # creating a false-negative drift match per R2 m1).
            ON_VPS_UNIT=$(systemctl cat kalshi-bot 2>/dev/null) \
              || { echo "FAIL: kalshi-bot.service not installed on VPS. Recovery (ssh -t to VPS): cd ~/kalshi-bot-repo && git fetch origin main && git reset --hard origin/main && bash ops/install.sh"; exit 1; }
            REPO_UNIT=$(git show ${{ github.sha }}:ops/kalshi-bot.service) \
              || { echo "FAIL: cannot read ops/kalshi-bot.service @ commit ${{ github.sha }} (file missing OR repo state corrupted — see git error above). R3-m1: stderr intentionally not redirected so the actual git failure surfaces."; exit 1; }
            diff <(echo "$ON_VPS_UNIT" | grep -E -v '^# /(etc|run|usr/lib)/') <(echo "$REPO_UNIT" | grep -E -v '^# /(etc|run|usr/lib)/') \
              || { echo "FAIL: on-VPS systemd unit differs from ops/kalshi-bot.service @ ${{ github.sha }}. Recovery (ssh -t to VPS): cd ~/kalshi-bot-repo && git fetch origin main && git reset --hard origin/main && bash ops/install.sh, then re-trigger this deploy. NOTE: bare 'bash ops/install.sh' without the fetch+reset would re-install the PRIOR commit's unit and the next deploy would loop on the same drift FAIL."; exit 1; }
            git reset --hard ${{ github.sha }}
            python3 -c "import ast; ast.parse(open('bot/_impl.py').read()); ast.parse(open('bot/constants.py').read()); print('SYNTAX OK')"
            sudo systemctl restart kalshi-bot
            # Documentation drift check (warning only — never blocks deploy)
            python3 scripts/doc_drift_check.py --telegram 2>&1 || echo "DOC DRIFT DETECTED — see report above"
