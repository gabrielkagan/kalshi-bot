name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r requirements.txt
      - name: Syntax check
        run: python3 -c "import ast; ast.parse(open('bot.py').read())"
      - name: Run blocking tests
        run: pytest tests/ -m "not fragile" -v --tb=short --ignore=venv

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: botuser
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/kalshi-bot-repo
            git pull origin main
            python3 -c "import ast; ast.parse(open('bot.py').read()); print('SYNTAX OK')" 2>/dev/null && \
            sudo systemctl restart kalshi-bot || echo "No bot.py yet, skipping restart"
            # Documentation drift check (warning only — never blocks deploy)
            python3 scripts/doc_drift_check.py --telegram 2>&1 || echo "DOC DRIFT DETECTED — see report above"
