name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: botuser
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/kalshi-bot-repo
            git pull origin main
            python3 -c "import ast; ast.parse(open('bot.py').read()); print('SYNTAX OK')" 2>/dev/null && \
            sudo systemctl restart kalshi-bot || echo "No bot.py yet, skipping restart"
            # Documentation drift check (warning only — never blocks deploy)
            python3 scripts/doc_drift_check.py --telegram 2>&1 || echo "DOC DRIFT DETECTED — see report above"
