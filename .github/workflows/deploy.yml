name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r requirements.txt
      - name: Syntax check
        run: python3 -c "import ast; ast.parse(open('bot.py').read())"
      - name: Run blocking tests
        run: pytest tests/ -m "not fragile" -v --tb=short --ignore=venv

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: botuser
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/kalshi-bot-repo
            # Pin to the exact commit that triggered this deploy. `git pull`
            # races with parallel auto-commits (whitepaper.yml pushes [skip ci]
            # PDFs). `reset --hard` to ${{ github.sha }} stays on `main` (no
            # detached HEAD for VPS-side cron / start.sh assumptions) and
            # blasts through any dirty tree.
            git fetch origin main
            git checkout main
            git reset --hard ${{ github.sha }}
            python3 -c "import ast; ast.parse(open('bot.py').read()); print('SYNTAX OK')"
            sudo systemctl restart kalshi-bot
            # Documentation drift check (warning only — never blocks deploy)
            python3 scripts/doc_drift_check.py --telegram 2>&1 || echo "DOC DRIFT DETECTED — see report above"
