name: Deploy to VPS

on:
  push:
    branches: [main]

# Serialize VPS-touching workflows (deploy + install_h4_cron) so they
# can't race on ~/kalshi-bot-repo working tree. cancel-in-progress=false
# means we wait rather than kill an in-flight deploy mid-pull.
concurrency:
  group: vps-deploy
  cancel-in-progress: false

# Bit-7 (CI perf umbrella 86b9zjtzk, 2026-05-17): mirror test.yml's
# parallel-jobs structure. Bit-9 (2026-05-17) further splits
# integration-parallel into 2 hash-balanced shards. All 4 test jobs
# are BLOCKING (no continue-on-error) and the `deploy` job is gated
# on `needs:` of all 4. Deploy is the higher-stakes gate — an
# integration regression must abort deploy regardless of which
# sub-tier surfaced it. Wall-time projection on deploy: ~70-90s for
# the test phase + ~10-20s for the VPS-side deploy step.

jobs:
  fast-tiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      # CI perf Bit-8 (umbrella 86b9zjtzk, ticket 86b9zkk1u, 2026-05-17).
      # Mirrors test.yml. Caches the FULL installed Python location
      # across runs so pip install becomes near no-op on cache hit.
      # Same key across all 6 jobs (test.yml × 3 + deploy.yml × 3)
      # for cross-workflow reuse. Contract pin:
      # tests/contracts/test_ci_workflows_venv_cache.py.
      - name: Cache installed venv
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: pylocation-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e '.[dev]'
      - name: Syntax check
        run: make ast-check
      - name: Unit tier (Pillar 5)
        run: make test-unit
      - name: Contract tier — pytest
        run: make test-contract-pytest
      - name: Contract tier — import-linter
        run: make test-contract-lint
      - name: Equivalence tier (Pillar 3)
        # Direct pushes to main (whitepaper auto-commit, operator hotfix)
        # skip test.yml's pull_request gate, so this step has to be in
        # deploy.yml too — otherwise an engine-output drift could ride a
        # hotfix straight to the VPS.
        run: make test-equivalence

  integration-shard-0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Cache installed venv
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: pylocation-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e '.[dev]'
      - name: Integration tier — shard 0 of 2 (BLOCKING on deploy)
        # Bit-9 (CI perf umbrella 86b9zjtzk): pytest-shard hash-splits
        # the integration tier into 2 jobs concurrently. BLOCKING here
        # (no continue-on-error) — last chance to catch a behavioral
        # regression before the VPS pulls.
        run: make test-integration-shard-0

  integration-shard-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Cache installed venv
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: pylocation-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e '.[dev]'
      - name: Integration tier — shard 1 of 2 (BLOCKING on deploy)
        # Bit-9 sister to integration-shard-0; runs pytest-shard
        # --shard-id=1 of the same corpus.
        run: make test-integration-shard-1

  integration-serial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      # CI perf Bit-8 (umbrella 86b9zjtzk, ticket 86b9zkk1u, 2026-05-17).
      # Mirrors test.yml. Caches the FULL installed Python location
      # across runs so pip install becomes near no-op on cache hit.
      # Same key across all 6 jobs (test.yml × 3 + deploy.yml × 3)
      # for cross-workflow reuse. Contract pin:
      # tests/contracts/test_ci_workflows_venv_cache.py.
      - name: Cache installed venv
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: pylocation-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e '.[dev]'
      - name: Integration tier — serial (BLOCKING on deploy)
        # Bit-5: timing-sensitive @serial-marked tests in single-worker
        # pass. BLOCKING here for the same deploy-gate reason as
        # integration-parallel.
        run: make test-integration-serial

  deploy:
    needs: [fast-tiers, integration-shard-0, integration-shard-1, integration-serial]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: botuser
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/kalshi-bot-repo
            # Pin to the exact commit that triggered this deploy. `git pull`
            # races with parallel auto-commits (whitepaper.yml pushes [skip ci]
            # PDFs). `reset --hard` to ${{ github.sha }} stays on `main` (no
            # detached HEAD for VPS-side cron / start.sh assumptions) and
            # blasts through any dirty tree.
            git fetch origin main
            git checkout main
            # Pre-deploy: verify on-VPS systemd unit matches ops/kalshi-bot.service
            # at the deploy commit. If drift, abort BEFORE reset --hard so VPS
            # stays on the prior commit. Bit 2.0.5.2 of repo modularization plan
            # (kb/decisions/repo-modularization-plan-may05.md). Compares against
            # `git show ${{ github.sha }}:...` (the deploy-commit file) rather
            # than working-tree, which is still the PRIOR commit's content here
            # (git checkout main doesn't advance HEAD before reset --hard).
            # Filter `^# /(etc|run|usr/lib)/` strips systemd-cat path headers
            # from /etc, /run, /usr/lib drop-in dirs (allowlist — broader
            # `^# /` would also strip body comments matching `# /opt/...`,
            # creating a false-negative drift match per R2 m1).
            ON_VPS_UNIT=$(systemctl cat kalshi-bot 2>/dev/null) \
              || { echo "FAIL: kalshi-bot.service not installed on VPS. Recovery (ssh -t to VPS): cd ~/kalshi-bot-repo && git fetch origin main && git reset --hard origin/main && bash ops/install.sh"; exit 1; }
            REPO_UNIT=$(git show ${{ github.sha }}:ops/kalshi-bot.service) \
              || { echo "FAIL: cannot read ops/kalshi-bot.service @ commit ${{ github.sha }} (file missing OR repo state corrupted — see git error above). R3-m1: stderr intentionally not redirected so the actual git failure surfaces."; exit 1; }
            diff <(echo "$ON_VPS_UNIT" | grep -E -v '^# /(etc|run|usr/lib)/') <(echo "$REPO_UNIT" | grep -E -v '^# /(etc|run|usr/lib)/') \
              || { echo "FAIL: on-VPS systemd unit differs from ops/kalshi-bot.service @ ${{ github.sha }}. Recovery (ssh -t to VPS): cd ~/kalshi-bot-repo && git fetch origin main && git reset --hard origin/main && bash ops/install.sh, then re-trigger this deploy. NOTE: bare 'bash ops/install.sh' without the fetch+reset would re-install the PRIOR commit's unit and the next deploy would loop on the same drift FAIL."; exit 1; }
            git reset --hard ${{ github.sha }}
            # D1.5.1 (ticket 86b9zjtxn, 2026-05-17): install Python deps
            # BEFORE syntax check + restart. Without this, any commit
            # adding a new dep to requirements.txt silently crashloops
            # the service on restart (ModuleNotFoundError). Bit us
            # 2026-05-17 mid-D1.5 collector deploy on `zstandard`:
            # collector entered Restart=on-failure crashloop until the
            # operator manually `pip install`ed on the VPS.
            #
            # Uses venv-pip explicitly because appleboy/ssh-action runs
            # the script directly via SSH without sourcing ~/.bashrc,
            # so bare `pip` would resolve to system Python 3.11 (NOT
            # the bot's venv at ~/kalshi-bot-repo/venv/). Pinned by
            # tests/contracts/test_deploy_yml_pip_install_step.py.
            #
            # Shared venv per D0.3 §6 isolation contract (the
            # "SAME venv as the bot" detail lives in collector-start.sh:12-13
            # body comments): this install lands deps for BOTH
            # kalshi-bot AND kalshi-collector. `[dev]` extras intentionally
            # NOT installed here — runtime-only deps; deploy.yml never
            # pushes pytest/ruff/etc. to the VPS. D1.5.2 (lines ~135-200
            # below) ADDS path-aware kalshi-collector restart.
            ~/kalshi-bot-repo/venv/bin/pip install -r requirements.txt
            # Bit 9.3-iii.c (2026-05-11): bot/_impl.py DELETED. On-VPS syntax-check
            # targets the canonical runtime hotspots (matches Makefile `ast-check`).
            python3 -c "import ast; ast.parse(open('bot/constants.py').read()); ast.parse(open('bot/main_loop.py').read()); ast.parse(open('bot/scanner/__init__.py').read()); print('SYNTAX OK')"
            sudo systemctl restart kalshi-bot
            # D1.5.2 (ticket 86b9zjtya, 2026-05-17): path-aware
            # kalshi-collector restart. Pre-D1.5.2 deploy.yml restarted
            # ONLY kalshi-bot; every change to collector code paths
            # required an operator-issued manual restart on the VPS.
            # Bit us 3x in one session (D1.3-fu1 + D1.4-fu + D1.3-fu3,
            # all collector-affecting fixes that required manual ops
            # follow-up). The new block detects the changed paths in
            # the deploy commit and restarts kalshi-collector iff any
            # changed path matches the affecting set AND the collector
            # is currently active (opt-out via VPS-side
            # `sudo systemctl stop kalshi-collector` — operator's
            # stop-intent lives at the VPS terminal, not in commit
            # messages). `git diff --name-only` between the prior
            # deploy's SHA (${{ github.event.before }}) and the
            # current deploy's SHA (${{ github.sha }}) — NOT HEAD~1,
            # which is misleading post `git reset --hard`. Pinned by
            # tests/contracts/test_deploy_yml_path_aware_collector_restart.py.
            # Regex uses literal `.` (matches any char including `.`)
            # rather than escaped `\.` — functionally identical for path
            # strings that contain literal dots, and keeps the contract
            # test's literal-substring assertion simple.
            #
            # R1-M1 (D1.5.2 adv round 1): explicit null-SHA detection.
            # `${{ github.event.before }}` is 40 zeroes on initial push
            # to a new branch / after force-push history rewrite. `git
            # diff --name-only 0000... HEAD` fails. Fall back to ALWAYS
            # restart (safer than silent-skip — matches the plan doc's
            # Verification §4 fail-safe intent).
            #
            # R1-M2 + R2-C1 (D1.5.2 adv rounds 1+2): on git-diff failure
            # (valid SHA but unreachable — gc'd or never-fetched),
            # capture the exit separately and log + fall back to always-
            # restart rather than silently masking with `|| true`.
            # R2-C1: the substitution MUST run with `set +e` so a
            # failing $() doesn't trigger `set -e` and abort the WHOLE
            # script (which would skip the doc-drift check AND the
            # fallback restart itself). Re-enable `set -e` immediately
            # after the capture.
            COLLECTOR_RESTART_REASON=""
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              COLLECTOR_RESTART_REASON="initial-push / force-push history rewrite (null SHA)"
            else
              set +e
              COLLECTOR_DIFF_OUT=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>&1)
              COLLECTOR_DIFF_EXIT=$?
              set -e
              if [ $COLLECTOR_DIFF_EXIT -ne 0 ]; then
                COLLECTOR_RESTART_REASON="git diff failed (exit=$COLLECTOR_DIFF_EXIT): $(echo "$COLLECTOR_DIFF_OUT" | head -3 | tr '\n' '|') — falling back to always-restart"
              else
                # D2.5 prefix-overlap NOTE: `^collector/` matches BOTH
                # the Kalshi-side modules under `collector/` AND the
                # Coinbase-side modules (`coinbase_archiver.py`,
                # `coinbase_main_loop.py`). A Coinbase-only commit
                # that touches `collector/coinbase_*.py` therefore
                # triggers this Kalshi-collector restart too —
                # accepted as harmless over-restart: the Kalshi
                # collector restarts cleanly under all changes, and
                # shared modules like `writer.py` + `uploader.py`
                # genuinely DO affect both collectors. (Coinbase-only
                # commits that touch ONLY `coinbase_wire/*` do NOT
                # match this regex and so do NOT trigger Kalshi
                # restart — only the bot + Coinbase blocks fire.)
                # Tightening the regex to exclude `collector/coinbase_`
                # paths via PCRE negative-lookahead is not portable
                # across grep -E (GNU + BSD divergence).
                COLLECTOR_PATHS_CHANGED=$(echo "$COLLECTOR_DIFF_OUT" | grep -E "^(collector/|kalshi_wire/|ops/kalshi-collector.service$|collector-start.sh$|requirements.txt$)" || true)
                if [ -n "$COLLECTOR_PATHS_CHANGED" ]; then
                  COLLECTOR_RESTART_REASON="affected paths: $COLLECTOR_PATHS_CHANGED"
                fi
              fi
            fi
            if [ -n "$COLLECTOR_RESTART_REASON" ]; then
              if systemctl is-active --quiet kalshi-collector; then
                echo "D1.5.2 path-aware restart: $COLLECTOR_RESTART_REASON"
                # R3-C1 (D1.5.2 adv round 3): use `sudo -n` (non-interactive)
                # to match the bot-restart pattern AND fail LOUD-AND-FAST
                # if sudoers NOPASSWD has not been extended to include
                # kalshi-collector. appleboy/ssh-action has no tty, so
                # bare `sudo` would either hang waiting for a password
                # or fail with "sudo: a terminal is required" — either
                # way aborting the deploy silently. `sudo -n` fails
                # immediately with exit 1 + a recognizable error.
                # Operator action needed if this fires: extend
                # /etc/sudoers.d/botuser-systemctl-restart to include
                # `/bin/systemctl restart kalshi-collector` (see
                # feedback_vps_sudoers_collector_gap_may17).
                sudo -n /bin/systemctl restart kalshi-collector
              else
                echo "D1.5.2 path-aware restart: $COLLECTOR_RESTART_REASON — but kalshi-collector is NOT active (operator stopped); skipping restart to preserve operator intent. Run 'sudo systemctl start kalshi-collector' on VPS to resume auto-restart."
              fi
            fi
            # D2.5 (ticket 86b9znq4w, 2026-05-18): path-aware
            # kalshi-coinbase-collector restart. Mirror of the D1.5.2
            # block above with the Coinbase delta path set. Same
            # structure: null-SHA fallback + `set +e` wrapped git-diff
            # capture + diff-failure fallback to always-restart + is-
            # active opt-out gate + `sudo -n /bin/systemctl` posture.
            # Independent diff capture (not reusing COLLECTOR_DIFF_OUT)
            # so the two blocks have ZERO shared state; a future edit
            # to either block cannot regress the other. Pinned by
            # tests/contracts/test_deploy_yml_path_aware_coinbase_collector_restart.py.
            #
            # Affecting path set (mirror of D1.5.2 with Coinbase
            # equivalents):
            #   - coinbase_wire/                              (wire library)
            #   - collector/coinbase_archiver.py              (consumer)
            #   - collector/coinbase_main_loop.py             (orchestrator)
            #   - ops/kalshi-coinbase-collector.service       (systemd unit)
            #   - coinbase-collector-start.sh                 (wrapper)
            #   - requirements.txt                            (shared venv)
            #
            # Operator action needed before the first D2.5 deploy fires
            # this `sudo -n` form: extend /etc/sudoers.d/botuser-systemctl-
            # restart to ALSO include `/bin/systemctl restart
            # kalshi-coinbase-collector` (see ops/CLAUDE.md "D2.5
            # Coinbase collector deploy"). Until that extension lands,
            # the `sudo -n` fails LOUD with exit 1 + a recognizable
            # message — the deploy aborts BEFORE the broken restart
            # silently leaves the unit unrestarted.
            COINBASE_RESTART_REASON=""
            # Initialize next to RESTART_REASON so the unit-drift guard's
            # `echo "$COINBASE_PATHS_CHANGED" | grep -q` is safe on the
            # null-SHA / force-push path (where the else-branch that sets it
            # is skipped) — avoids a `set -u` unbound-variable stderr line and
            # makes the guard's skip behavior explicit. (R6 MINOR-1, 2026-05-30.)
            COINBASE_PATHS_CHANGED=""
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              COINBASE_RESTART_REASON="initial-push / force-push history rewrite (null SHA)"
            else
              set +e
              COINBASE_DIFF_OUT=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>&1)
              COINBASE_DIFF_EXIT=$?
              set -e
              if [ $COINBASE_DIFF_EXIT -ne 0 ]; then
                COINBASE_RESTART_REASON="git diff failed (exit=$COINBASE_DIFF_EXIT): $(echo "$COINBASE_DIFF_OUT" | head -3 | tr '\n' '|') — falling back to always-restart"
              else
                COINBASE_PATHS_CHANGED=$(echo "$COINBASE_DIFF_OUT" | grep -E "^(coinbase_wire/|collector/coinbase_archiver.py$|collector/coinbase_main_loop.py$|ops/kalshi-coinbase-collector.service$|coinbase-collector-start.sh$|requirements.txt$)" || true)
                if [ -n "$COINBASE_PATHS_CHANGED" ]; then
                  COINBASE_RESTART_REASON="affected paths: $COINBASE_PATHS_CHANGED"
                fi
              fi
            fi
            if [ -n "$COINBASE_RESTART_REASON" ]; then
              # 2026-05-30 (9-asset corpus, ADA/BCH): unit-drift guard.
              # deploy.yml does NOT cp units / daemon-reload (that is
              # ops/install.sh's job), so a bare restart after a UNIT-FILE
              # change runs against the STALE on-disk unit. For the
              # 256M→384M MemoryMax bump that means restarting the now-9-
              # product collector against the OLD 256M cap → OOM-kill window.
              # So when ops/kalshi-coinbase-collector.service is in the
              # changed set, verify the installed unit matches the deploy
              # commit and FAIL LOUD (run install.sh) rather than restart
              # against a stale cap. Mirrors the kalshi-bot unit-drift guard
              # above (read + diff + exit 1 — no new sudoers needed). Pinned
              # by test_deploy_yml_path_aware_coinbase_collector_restart.py::
              # test_deploy_yml_coinbase_unit_drift_guard_precedes_restart.
              if echo "$COINBASE_PATHS_CHANGED" | grep -q "ops/kalshi-coinbase-collector.service"; then
                ON_VPS_CB_UNIT=$(systemctl cat kalshi-coinbase-collector 2>/dev/null) \
                  || { echo "FAIL: kalshi-coinbase-collector.service not installed on VPS. Recovery (ssh -t to VPS): cd ~/kalshi-bot-repo && git reset --hard origin/main && bash ops/install.sh"; exit 1; }
                REPO_CB_UNIT=$(git show ${{ github.sha }}:ops/kalshi-coinbase-collector.service) \
                  || { echo "FAIL: cannot read ops/kalshi-coinbase-collector.service @ commit ${{ github.sha }}."; exit 1; }
                diff <(echo "$ON_VPS_CB_UNIT" | grep -E -v '^# /(etc|run|usr/lib)/') <(echo "$REPO_CB_UNIT" | grep -E -v '^# /(etc|run|usr/lib)/') \
                  || { echo "FAIL: on-VPS kalshi-coinbase-collector unit differs from ops/kalshi-coinbase-collector.service @ ${{ github.sha }} (likely a MemoryMax/cap change). A bare restart would run against the STALE on-disk cap (OOM risk). Recovery (ssh -t to VPS): cd ~/kalshi-bot-repo && git reset --hard origin/main && bash ops/install.sh, then re-trigger this deploy."; exit 1; }
              fi
              if systemctl is-active --quiet kalshi-coinbase-collector; then
                echo "D2.5 path-aware restart: $COINBASE_RESTART_REASON"
                sudo -n /bin/systemctl restart kalshi-coinbase-collector
              else
                echo "D2.5 path-aware restart: $COINBASE_RESTART_REASON — but kalshi-coinbase-collector is NOT active (operator stopped); skipping restart to preserve operator intent. Run 'sudo systemctl start kalshi-coinbase-collector' on VPS to resume auto-restart."
              fi
            fi
            # 86bbvqhyr (2026-09-06): path-aware kalshi-espn-collector
            # restart. Found at R4 of the ESPN-403 fix gate: the ESPN
            # collector had NO restart block, so a push touching
            # collector/espn_archiver.py left the old process (old
            # User-Agent, no espn_http_status_1h sidecar key) running
            # while the deploy looked green. Mirror of the D2.5 Coinbase
            # block with the ESPN delta path set + independent ESPN_*
            # state. Pinned by
            # tests/contracts/test_deploy_yml_path_aware_espn_collector_restart.py.
            #
            # Affecting path set:
            #   - collector/espn_archiver.py                  (poller)
            #   - collector/espn_main_loop.py                 (orchestrator)
            #   - collector/writer.py + collector/uploader.py (shared bronze I/O)
            #   - kalshi_wire/ws_client.py                    (build_envelope)
            #   - ops/kalshi-espn-collector.service           (systemd unit)
            #   - espn-collector-start.sh                     (wrapper)
            #   - requirements.txt                            (shared venv)
            # (kalshi-weather-collector still has no block — ticket filed.)
            ESPN_RESTART_REASON=""
            ESPN_PATHS_CHANGED=""
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              ESPN_RESTART_REASON="initial-push / force-push history rewrite (null SHA)"
            else
              set +e
              ESPN_DIFF_OUT=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>&1)
              ESPN_DIFF_EXIT=$?
              set -e
              if [ $ESPN_DIFF_EXIT -ne 0 ]; then
                ESPN_RESTART_REASON="git diff failed (exit=$ESPN_DIFF_EXIT): $(echo "$ESPN_DIFF_OUT" | head -3 | tr '\n' '|') — falling back to always-restart"
              else
                ESPN_PATHS_CHANGED=$(echo "$ESPN_DIFF_OUT" | grep -E "^(collector/espn_archiver.py$|collector/espn_main_loop.py$|collector/writer.py$|collector/uploader.py$|kalshi_wire/ws_client.py$|ops/kalshi-espn-collector.service$|espn-collector-start.sh$|requirements.txt$)" || true)
                if [ -n "$ESPN_PATHS_CHANGED" ]; then
                  ESPN_RESTART_REASON="affected paths: $ESPN_PATHS_CHANGED"
                fi
              fi
            fi
            if [ -n "$ESPN_RESTART_REASON" ]; then
              # Unit-drift guard (mirror of the Coinbase one): deploy.yml
              # never cp's units / daemon-reloads, so a bare restart after
              # a unit-file change would run against the STALE on-disk unit.
              if echo "$ESPN_PATHS_CHANGED" | grep -q "ops/kalshi-espn-collector.service"; then
                ON_VPS_ESPN_UNIT=$(systemctl cat kalshi-espn-collector 2>/dev/null) \
                  || { echo "FAIL: kalshi-espn-collector.service not installed on VPS. Recovery (ssh -t to VPS): cd ~/kalshi-bot-repo && git reset --hard origin/main && bash ops/install.sh"; exit 1; }
                REPO_ESPN_UNIT=$(git show ${{ github.sha }}:ops/kalshi-espn-collector.service) \
                  || { echo "FAIL: cannot read ops/kalshi-espn-collector.service @ commit ${{ github.sha }}."; exit 1; }
                diff <(echo "$ON_VPS_ESPN_UNIT" | grep -E -v '^# /(etc|run|usr/lib)/') <(echo "$REPO_ESPN_UNIT" | grep -E -v '^# /(etc|run|usr/lib)/') \
                  || { echo "FAIL: on-VPS kalshi-espn-collector unit differs from ops/kalshi-espn-collector.service @ ${{ github.sha }}. Recovery (ssh -t to VPS): cd ~/kalshi-bot-repo && git reset --hard origin/main && bash ops/install.sh, then re-trigger this deploy."; exit 1; }
              fi
              if systemctl is-active --quiet kalshi-espn-collector; then
                echo "86bbvqhyr path-aware restart: $ESPN_RESTART_REASON"
                sudo -n /bin/systemctl restart kalshi-espn-collector
              else
