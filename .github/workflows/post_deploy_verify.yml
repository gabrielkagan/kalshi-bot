name: Post-Deploy Verify

on:
  workflow_run:
    workflows: ["Deploy to VPS"]
    types: [completed]

jobs:
  verify:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Wait for bot restart + warmup
        # 90s is enough for restart + first scan tick, but the
        # 15m_scan_liveness DB-row check (5-min lookback, 10-row
        # threshold) needs RK kernels to fill (~1-3 min) and the
        # vol engine to start producing non-None outputs. 240s
        # (4 min) gives the bot enough warmup to hit the steady
        # scan rate (~23/min in production) before the rate-based
        # check runs. Apr 26 false-positive: 90s wait + 4 rows in
        # 100s tripped the strict gate.
        run: sleep 240

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: botuser
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: EXPECTED_SHA
          script: |
            set -e

            echo "=== Post-Deploy Verification ==="

            # 1. Service is active
            echo "[1/6] Checking service status..."
            if ! systemctl is-active --quiet kalshi-bot; then
              echo "FAIL: kalshi-bot service is not active"
              exit 1
            fi
            echo "  OK: Service is active"

            # 2. Commit hash matches the SHA that triggered this deploy.
            # Compare against the trigger SHA, NOT `git ls-remote origin main`
            # — the latter races with parallel auto-commits (whitepaper.yml
            # pushes a [skip ci] commit during our 90s sleep) and produces
            # spurious "VPS != remote" failures. The trigger SHA is fixed for
            # the lifetime of this workflow.
            echo "[2/6] Checking commit hash..."
            if [ -z "${EXPECTED_SHA:-}" ]; then
              echo "FAIL: EXPECTED_SHA is empty (workflow_run payload issue)"
              exit 1
            fi
            cd ~/kalshi-bot-repo
            LOCAL_HASH=$(git rev-parse HEAD)
            if [ "$LOCAL_HASH" != "$EXPECTED_SHA" ]; then
              echo "FAIL: VPS commit ($LOCAL_HASH) != deploy trigger ($EXPECTED_SHA)"
              exit 1
            fi
            echo "  OK: Commit $LOCAL_HASH matches deploy trigger"

            # 3. No errors in last 2 minutes of logs.
            # Filter known-benign noise:
            # - `API error.*events.*400`: 400s on event discovery from sports
            #   leagues with no active games (KXFIFAGAME, KXAFCONGAME, etc.) —
            #   Kalshi returns 400 for those, bot logs and moves on. Each
            #   failed probe emits 2 lines (body + requests.exceptions).
            # - `Unknown subscription ID`: Kalshi WS response when we
            #   unsubscribe a sid that's already been pruned server-side
            #   (race during window-rotation). Defended by _unsubscribe_blacklist
            #   (commit ea51c41 / kb/failures/scan-loop-stall-window-rotation-
            #   2026-04-26.md). Each event emits 2 lines (WS_RAW_IN raw frame +
            #   WS_ERROR_FRAME warning); both match `Unknown subscription ID`.
            echo "[3/6] Checking recent logs for errors..."
            ERROR_PATTERN="error|traceback|exception"
            BENIGN_PATTERN="API error.*events.*400|Unknown subscription ID"
            ERROR_COUNT=$(journalctl -u kalshi-bot --since "2 minutes ago" --no-pager 2>/dev/null \
              | grep -iE "$ERROR_PATTERN" \
              | grep -ivE "$BENIGN_PATTERN" \
              | wc -l)
            if [ "$ERROR_COUNT" -gt 2 ]; then
              echo "WARN: $ERROR_COUNT non-benign error lines in last 2 min"
              journalctl -u kalshi-bot --since "2 minutes ago" --no-pager | grep -iE "$ERROR_PATTERN" | grep -ivE "$BENIGN_PATTERN" | tail -5
              exit 1
            fi
            echo "  OK: $ERROR_COUNT non-benign error lines (threshold: 2)"

            # 4. Run audit_cron to verify metrics computation
            echo "[4/6] Running audit_cron.py..."
            cd ~/kalshi-bot-repo
            venv/bin/python3 scripts/audit_cron.py --db state.db 2>&1 | tail -10
            echo "  OK: audit_cron completed"

            # 5. DB-row verification per enabled feature flag. Catches the
            # nested-gate / silent-kill-switch bug class that checks 1-3
            # cannot see (e.g., weather-NO-never-fires Apr 4-11, STC-shadow
            # dead gate 98c954d). 15M scan liveness is strict (fails
            # deploy); other kill-switch checks are warnings for the first
            # soak period — escalate to --strict-all after known-green.
            echo "[5/6] Running postdeploy_verify.py..."
            cd ~/kalshi-bot-repo
            # No --bot-py flag: postdeploy_verify.py defaults to a multi-path
            # scan over both bot source files per Bit 3.1. Pinning the flag
            # to either single file would silently skip the 4 gating-flag
            # checks (WEATHER_NO_SIDE_LIVE etc. live in bot/constants.py
            # post-extraction). Regression: tests/test_constants_extraction.py
            # ::test_post_deploy_verify_yml_does_not_pin_bot_impl_only.
            venv/bin/python3 scripts/postdeploy_verify.py --db state.db --env .env
            echo "  OK: postdeploy_verify completed"

            # 6. Bot reached init AND is not in a crash loop. Smell 3 from
            # Bit 2.1a postmortem (kb/failures/bit-2.1a-systemd-mismatch-may06.md):
            # systemctl is-active reports "activating" during a crash loop
            # (not "failed"), so steps 1-5 don't catch a bot that starts,
            # dies, restarts, dies, ... — exactly what Bit 2.1a hit. The
            # cal_mlp integration writes one row UNCONDITIONALLY at startup
            # to bot_startup_log (`scripts/cal_mlp/integration.py:457`),
            # so 0 rows in a 5-min window after the deploy proves the bot
            # crashed before init completed; ≥3 rows in 5 min proves a
            # post-init crash loop. Threshold logic + SQL semantics live
            # in `scripts/post_deploy_scan_gate.py` (mirrors the
            # postdeploy_verify.py / audit_cron.py separate-script
            # convention; the VPS doesn't have a `sqlite3` CLI
            # installed so we use Python's stdlib sqlite3 module).
            # Empirical: 92 historical pairs over last 8d, max 2 events
            # in any 5-min window — ≥3 has zero false-positives. Catalog
            # gaps + market quietude + WS reconnects do NOT cause
            # restarts and do NOT write extra rows. Spec correction at
            # kb/decisions/bit-2.0.5.3-spec-correction-may07.md (2-pivot
            # journey across 3 candidate signals: evaluated_opportunities
            # → market_observations_continuous → bot_startup_log).
            echo "[6/6] Verifying bot startup pattern (no crash loop, deploy reached init)..."
            cd ~/kalshi-bot-repo
            venv/bin/python3 scripts/post_deploy_scan_gate.py --db state.db --window-seconds 300 --max-events 2

            echo ""
            echo "=== All post-deploy checks passed ==="

      - name: Alert on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: botuser
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/kalshi-bot-repo
            source .env 2>/dev/null || true
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="$TELEGRAM_CHAT_ID" \
                -d text="*Post-Deploy Verify FAILED*%0ACommit: $(git rev-parse --short HEAD)%0ACheck GitHub Actions for details." \
                -d parse_mode="Markdown" || true
            fi
