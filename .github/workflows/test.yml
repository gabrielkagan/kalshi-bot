name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e '.[dev]'
      - name: Syntax check
        run: python3 -c "import ast; ast.parse(open('bot/_impl.py').read()); ast.parse(open('bot/constants.py').read())"
      - name: Import-linter contracts (Pillar 2)
        # Pillar 2 of testing-foundation-sprint (ticket 86b9ve0yt). Runs
        # before pytest so a layering violation fails fast (≈0.5s vs the
        # ~2s+ pytest collection cost). Reads contracts from .importlinter
        # at the repo root; root_package=bot. Blocks merge on broken
        # contracts. The ignore_imports for bot.engines.probability →
        # bot._impl is documented in .importlinter inline + the Pillar 2
        # closeout KB doc.
        run: lint-imports
      - name: Engine equivalence (Pillar 3)
        # Pillar 3 of testing-foundation-sprint (ticket 86b9ve0zu).
        # Snapshot + property tests under tests/equivalence/ pin
        # numerical engine outputs against a 1000-row corpus
        # (ProbabilityEngine) + 9 deterministic synthetic scenarios
        # (VolatilityEngine static methods). Runs before the broad
        # pytest tier as a fast-failing guardrail (~3s) so engine
        # drift surfaces ahead of the ~5min full suite. Always
        # blocking — not path-filtered to bot/engines/ because
        # transitive drift (e.g., constant changes that flow into
        # engine inputs) does not touch bot/engines/ itself.
        run: pytest tests/equivalence/ -v --tb=short
      - name: Run blocking tests
        # `--ignore=tests/equivalence` because the dedicated equivalence
        # step above already ran them — without it, hypothesis re-runs
        # with a different cache state and the snapshots are
        # redundantly checked twice. Saves ~3s per run + cleaner
        # failure attribution.
        run: pytest tests/ -m "not fragile" -v --tb=short --ignore=venv --ignore=tests/equivalence
      - name: Run fragile tests (informational)
        if: always()
        run: pytest tests/ -m "fragile" -v --tb=short --ignore=venv --ignore=tests/equivalence || true
