name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e '.[dev]'
      - name: Syntax check
        run: python3 -c "import ast; ast.parse(open('bot/_impl.py').read()); ast.parse(open('bot/constants.py').read())"
      # Pillar 5 (testing-foundation-sprint, ticket 86b9ve11y) tiers the
      # pytest suite into unit < contract < equivalence < integration so
      # the cheapest-to-fail-loudest layer fires first. Each tier maps to
      # a Make target — single source of truth in the Makefile, mirrored
      # here. Blocking = unit + contract + equivalence; integration runs
      # but is informational (continue-on-error: true) so a slow
      # integration regression doesn't gate every PR. Deploy.yml keeps
      # integration BLOCKING because deploys are the higher-stakes gate.
      - name: Unit tier (Pillar 5)
        # Pure-Python invariants: pyproject parsing, Makefile parsing,
        # repo hygiene. <10s budget; sub-second on Linux.
        run: make test-unit
      # Contract tier split into two distinct CI steps (ticket
      # 86b9vgh3t). Pre-split, `make test-contract` chained pytest
      # then lint-imports in one Make recipe — a red `Contract tier`
      # step left the operator guessing which half failed.
      # Post-split, the step names map unambiguously to one half:
      #   * `Contract tier — pytest`        — public_api snapshot,
      #     AST guards (test_*_extraction.py family + call_sites /
      #     db_signatures / config_consistency / order_outcome_vocab).
      #   * `Contract tier — import-linter` — Pillar 2 layering
      #     contracts (.importlinter).
      # Both must pass for the tier to gate green; pytest-half runs
      # first because it's the louder failure (more lines of output).
      - name: Contract tier — pytest
        run: make test-contract-pytest
      - name: Contract tier — import-linter
        run: make test-contract-lint
      - name: Equivalence tier (Pillar 3)
        # Numeric snapshots + property tests for bot/engines/{volatility,
        # probability}.py. Kept as its own non-testmon-cached step
        # (testmon's "skip unchanged" semantics conflict with snapshot
        # regen-detection — a YAML diff is real signal that testmon
        # would silently skip if no .py file in the equivalence dir
        # changed).
        run: make test-equivalence
      - name: Integration tier (Pillar 5 — informational)
        # The remaining ~2900 tests. continue-on-error: true means a
        # failure here flags red on the step but doesn't fail the
        # workflow. Combined with the blocking tiers above, agents get
        # fast PR feedback while real integration regressions still
        # surface in the UI. Deploy.yml's mirror step IS blocking.
        if: always()
        continue-on-error: true
        run: make test-integration
      - name: Fragile tests (informational)
        # Existing fragile-marker informational step. Kept as-is —
        # Pillar 5 didn't reclassify fragile tests.
        if: always()
        run: pytest tests/ -m "fragile" -v --tb=short --ignore=venv --ignore=tests/equivalence || true
