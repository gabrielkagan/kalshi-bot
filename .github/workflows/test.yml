name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Bit-7 (CI perf umbrella 86b9zjtzk, 2026-05-17): split the historical
# single `test` job into 3 parallel jobs so the long-pole integration
# tier no longer gates the fast tiers.
#
#   fast-tiers          — unit + contract + equivalence + fragile (BLOCKING)
#   integration-parallel — make test-integration (xdist)  (INFORMATIONAL)
#   integration-serial   — make test-integration-serial   (INFORMATIONAL)
#
# Wall-time projection: 220s (pre-Bit-7) → ~90-110s (post-Bit-7), the
# `max(fast-tiers wall, integration-parallel wall, integration-serial wall)`
# plus per-job setup overhead. Each job independently restores Bit-2's pip
# cache (no cross-job sharing in GH Actions, but the cache key is shared so
# all 3 jobs hit the same cached wheels). Contract pin at
# tests/contracts/test_ci_workflows_parallel_jobs.py.

jobs:
  fast-tiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # CI perf Bit-2 (umbrella 86b9zjtzk, 2026-05-17). Caches the pip
          # download + wheel build dir across runs (~20-25s saving). The
          # SAME cache key (hash of requirements.txt + pyproject.toml) is
          # used by all 3 Bit-7 parallel jobs so a single cache fill on
          # main feeds every PR job. Contract pin lives at
          # tests/contracts/test_ci_workflows_pip_cache.py.
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e '.[dev]'
      - name: Syntax check
        run: make ast-check
      - name: Unit tier (Pillar 5)
        run: make test-unit
      - name: Contract tier — pytest
        run: make test-contract-pytest
      - name: Contract tier — import-linter
        run: make test-contract-lint
      - name: Equivalence tier (Pillar 3)
        run: make test-equivalence
      - name: Fragile tests (informational)
        if: always()
        run: pytest tests/ -m "fragile" -v --tb=short --ignore=venv --ignore=tests/equivalence || true

  integration-parallel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e '.[dev]'
      - name: Integration tier — parallel (xdist)
        # Bit-5 (CI perf umbrella 86b9zjtzk): pytest-xdist parallelizes
        # the integration tier via -n auto --dist=loadfile. Bit-7 lifts
        # this into its own GH job so it runs concurrently with
        # fast-tiers + integration-serial.
        continue-on-error: true
        run: make test-integration

  integration-serial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e '.[dev]'
      - name: Integration tier — serial (@serial-marked)
        # Bit-5: timing-sensitive @serial-marked tests
        # (subprocess/threading-Barrier/SIGALRM) run in a single-worker
        # pass. Bit-7 lifts this into its own GH job for full concurrency.
        continue-on-error: true
        run: make test-integration-serial
