name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r requirements.txt
      - name: Syntax check
        run: python3 -c "import ast; ast.parse(open('bot.py').read())"
      - name: Run blocking tests
        run: pytest tests/ -m "not fragile" -v --tb=short --ignore=venv
      - name: Run fragile tests (informational)
        if: always()
        run: pytest tests/ -m "fragile" -v --tb=short --ignore=venv || true
