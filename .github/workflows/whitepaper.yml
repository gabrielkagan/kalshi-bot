name: Generate Whitepaper PDF

on:
  push:
    branches: [main]
    # Bit 9.3-iii.c (2026-05-11): bot/_impl.py DELETED — paths trigger
    # watches the canonical runtime hotspots that affect whitepaper content.
    paths:
      - 'bot/constants.py'
      - 'bot/main_loop.py'
      - 'bot/scanner/__init__.py'
      - 'bot/executor.py'
      - 'docs/whitepaper/whitepaper.md'
      - 'docs/whitepaper/whitepaper_investor.md'
      - 'README.template.md'
      - 'scripts/ops/generate_whitepaper_stats.py'
      - 'scripts/ops/build_whitepaper.py'
      - 'scripts/ops/extract_config.py'
      - 'scripts/audit/check_docs_freshness.py'
      - 'bot/engines/sports_data.py'
      - 'bot/engines/sports_engine.py'
      - 'bot/engines/spx_engine.py'
      - 'bot/engines/weather_engine.py'
      - 'templates/**'
      - '.github/workflows/whitepaper.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  whitepaper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Upload stats script to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: botuser
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "scripts/ops/generate_whitepaper_stats.py"
          target: "/tmp/whitepaper_upload"

      - name: Generate stats JSON on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: botuser
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/kalshi-bot-repo
            python3 /tmp/whitepaper_upload/scripts/ops/generate_whitepaper_stats.py ~/kalshi-bot-repo/state.db > /tmp/whitepaper_stats.json
            cat /tmp/whitepaper_stats.json

      - name: Setup SSH and fetch stats
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          mkdir -p docs/whitepaper
          scp botuser@${{ secrets.VPS_HOST }}:/tmp/whitepaper_stats.json ./docs/whitepaper/whitepaper_stats.json
          cat docs/whitepaper/whitepaper_stats.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Extract config and render docs
        run: |
          python3 scripts/ops/extract_config.py > config.json
          python3 scripts/ops/build_whitepaper.py

      - name: Check docs freshness
        run: python3 scripts/audit/check_docs_freshness.py || true

      - name: Install pandoc and TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-xetex texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended lmodern fonts-dejavu
          wget -q https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-1-amd64.deb
          sudo dpkg -i pandoc-3.6.4-1-amd64.deb
          wget -q https://github.com/Wandmalfarbe/pandoc-latex-template/releases/latest/download/Eisvogel.tar.gz
          mkdir -p ~/.local/share/pandoc/templates
          tar xf Eisvogel.tar.gz -C ~/.local/share/pandoc/templates --strip-components=1 --wildcards "*/eisvogel.latex"

      - name: Generate technical PDF
        run: >-
          pandoc docs/whitepaper/whitepaper_rendered.md
          -o docs/whitepaper/whitepaper.pdf
          --from markdown
          --pdf-engine=xelatex
          --template eisvogel
          --highlight-style=tango
          --listings

      - name: Generate investor PDF
        run: >-
          pandoc docs/whitepaper/whitepaper_investor_rendered.md
          -o docs/whitepaper/whitepaper_investor.pdf
          --from markdown
          --pdf-engine=xelatex
          --template eisvogel

      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/whitepaper/whitepaper.pdf docs/whitepaper/whitepaper_investor.pdf README.md docs/whitepaper/whitepaper_rendered.md docs/whitepaper/whitepaper_investor_rendered.md docs/whitepaper/whitepaper_stats.json config.json
          git diff --cached --quiet || git commit -m "Auto-generate whitepaper PDFs and README stats [skip ci]"
          git push
