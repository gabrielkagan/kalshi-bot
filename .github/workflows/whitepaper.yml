name: Generate Whitepaper PDF

on:
  push:
    branches: [main]
    paths:
      - 'bot.py'
      - 'whitepaper.md'
      - 'whitepaper_investor.md'
      - 'README.template.md'
      - 'scripts/generate_whitepaper_stats.py'
      - 'scripts/build_whitepaper.py'
      - 'scripts/extract_config.py'
      - 'scripts/check_docs_freshness.py'
      - 'sports_data.py'
      - 'weather_engine.py'
      - 'templates/**'
      - '.github/workflows/whitepaper.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  whitepaper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Upload stats script to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: botuser
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "scripts/generate_whitepaper_stats.py"
          target: "/tmp/whitepaper_upload"

      - name: Generate stats JSON on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: botuser
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/kalshi-bot-repo
            python3 /tmp/whitepaper_upload/scripts/generate_whitepaper_stats.py ~/kalshi-bot-repo/state.db > /tmp/whitepaper_stats.json
            cat /tmp/whitepaper_stats.json

      - name: Setup SSH and fetch stats
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          scp botuser@${{ secrets.VPS_HOST }}:/tmp/whitepaper_stats.json ./whitepaper_stats.json
          cat whitepaper_stats.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Extract config and render docs
        run: |
          python3 scripts/extract_config.py > config.json
          python3 scripts/build_whitepaper.py

      - name: Check docs freshness
        run: python3 scripts/check_docs_freshness.py || true

      - name: Install pandoc and TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-xetex texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended lmodern
          wget -q https://github.com/Wandmalfarbe/pandoc-latex-template/releases/latest/download/Eisvogel.tar.gz
          mkdir -p ~/.local/share/pandoc/templates
          tar xf Eisvogel.tar.gz -C ~/.local/share/pandoc/templates --strip-components=1 --wildcards "*/eisvogel.latex"

      - name: Generate technical PDF
        run: >-
          pandoc whitepaper_rendered.md
          -o whitepaper.pdf
          --from markdown
          --pdf-engine=xelatex
          --template eisvogel
          --highlight-style=tango
          --listings

      - name: Generate investor PDF
        run: >-
          pandoc whitepaper_investor_rendered.md
          -o whitepaper_investor.pdf
          --from markdown
          --pdf-engine=xelatex
          --template eisvogel

      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add whitepaper.pdf whitepaper_investor.pdf README.md whitepaper_rendered.md whitepaper_investor_rendered.md whitepaper_stats.json config.json
          git diff --cached --quiet || git commit -m "Auto-generate whitepaper PDFs and README stats [skip ci]"
          git push
