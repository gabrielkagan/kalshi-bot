name: Generate Whitepaper PDF

on:
  push:
    branches: [main]
    paths:
      - 'whitepaper.md'
      - 'whitepaper_investor.md'
      - 'README.template.md'
      - 'scripts/generate_whitepaper_stats.py'
      - 'scripts/build_whitepaper.py'
      - '.github/workflows/whitepaper.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  whitepaper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload stats script to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: botuser
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "scripts/generate_whitepaper_stats.py"
          target: "/tmp/whitepaper_upload"

      - name: Generate stats JSON on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: botuser
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/kalshi-bot-repo
            python3 /tmp/whitepaper_upload/scripts/generate_whitepaper_stats.py > /tmp/whitepaper_stats.json
            cat /tmp/whitepaper_stats.json

      - name: Setup SSH and fetch stats
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          scp botuser@${{ secrets.VPS_HOST }}:/tmp/whitepaper_stats.json ./whitepaper_stats.json
          cat whitepaper_stats.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render whitepaper with stats
        run: python3 scripts/build_whitepaper.py

      - name: Generate technical PDF
        uses: docker://pandoc/extra:latest
        with:
          args: >-
            whitepaper_rendered.md
            -o whitepaper.pdf
            --from markdown
            --pdf-engine=xelatex
            --toc
            --toc-depth=3
            -V geometry:margin=1in
            -V fontsize=11pt
            -V documentclass=article
            --metadata title="Kalshi Crypto Trading Bot — Technical Whitepaper"

      - name: Generate investor PDF
        uses: docker://pandoc/extra:latest
        with:
          args: >-
            whitepaper_investor_rendered.md
            -o whitepaper_investor.pdf
            --from markdown
            --pdf-engine=xelatex
            --toc
            --toc-depth=3
            -V geometry:margin=1in
            -V fontsize=11pt
            -V documentclass=article
            --metadata title="Kalshi Crypto Trading Bot — Investor Whitepaper"

      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add whitepaper.pdf whitepaper_investor.pdf README.md
          git diff --cached --quiet || git commit -m "Auto-generate whitepaper PDFs and README stats [skip ci]"
          git push
