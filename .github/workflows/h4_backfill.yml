name: H-4 daily backfills

# H-4a/b/c daily cron via GitHub Actions instead of systemd timers.
# Pivoted from setup_h4_cron.sh (blocked by narrow VPS sudoers — botuser
# has NOPASSWD only for `systemctl restart kalshi-bot`, not for the
# `tee /etc/systemd/system/* + systemctl daemon-reload + enable + start`
# the install needs). GH Actions only needs SSH as botuser (no sudo)
# to run the backfill scripts.
#
# Scheduling: 3 staggered daily crons via GitHub-Actions native scheduler.
#   - 04:00 UTC → GDELT
#   - 04:30 UTC → Glassnode
#   - 05:00 UTC → CryptoCompare
# Each cron triggers the SAME workflow but the job dispatches on
# github.event.schedule to run only the matching backfill.
#
# Manual trigger:
#   gh workflow run h4_backfill.yml -f source=gdelt
#   gh workflow run h4_backfill.yml -f source=glassnode
#   gh workflow run h4_backfill.yml -f source=cryptocompare
#   gh workflow run h4_backfill.yml -f source=all   # all 3 sequentially
#
# Telegram alerting: each backfill runs through h4_run_with_alert.py
# which posts to Telegram on non-zero exit. Creds (TELEGRAM_BOT_TOKEN /
# CHAT_ID) come from the VPS .env, sourced before invocation.

on:
  # Schedules disabled 2026-05-04 pending backfill-script fixes:
  #   - GDELT: HTTP 429 on first call (rate-limit; needs backoff)
  #   - CryptoCompare: requires API key (CC policy changed)
  #   - Glassnode: untested; needs GLASSNODE_API_KEY for paid metrics
  # Re-enable by un-commenting once each script handles its API requirement.
  # schedule:
  #   - cron: '0 4 * * *'   # gdelt
  #   - cron: '30 4 * * *'  # glassnode
  #   - cron: '0 5 * * *'   # cryptocompare
  workflow_dispatch:
    inputs:
      source:
        description: 'Which backfill to run (gdelt|glassnode|cryptocompare|all)'
        required: true
        default: 'all'
        type: choice
        options:
          - gdelt
          - glassnode
          - cryptocompare
          - all

# Serialize H-4 backfills among themselves (no overlap with concurrent
# manual + scheduled runs), but DON'T share the deploy.yml lock — the
# backfill is read-only on the working tree (no git operations) and can
# safely run alongside a deploy. Relevant context for crit #4 of the
# round-1 review: prior design held vps-deploy for the full workflow,
# blocking deploys for up to 90m on a `source=all` run.
concurrency:
  group: vps-h4
  cancel-in-progress: false

jobs:
  resolve:
    # Map cron schedule → source name, OR pass through workflow_dispatch input.
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.pick.outputs.sources }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sel="${{ github.event.inputs.source }}"
          else
            case "${{ github.event.schedule }}" in
              "0 4 * * *")   sel="gdelt" ;;
              "30 4 * * *")  sel="glassnode" ;;
              "0 5 * * *")   sel="cryptocompare" ;;
              # Round-1 critique #2 fix: don't fall through to "all" on
              # an unknown schedule string. If GH ever normalizes whitespace
              # or we add a cron without updating this case, fail loud
              # instead of silently 3x-firing all backfills.
              *) echo "ERROR: unknown schedule '${{ github.event.schedule }}'" >&2; exit 1 ;;
            esac
          fi
          if [ "$sel" = "all" ]; then
            echo 'sources=["gdelt","glassnode","cryptocompare"]' >> "$GITHUB_OUTPUT"
          else
            echo "sources=[\"$sel\"]" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved sources: $sel"

  backfill:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      # Sequential, not parallel — avoids 3 concurrent SQLite writers
      # racing against the bot's main scan-loop writer (WAL absorbs the
      # contention but tail-latency on the bot side spikes).
      max-parallel: 1
      fail-fast: false
      matrix:
        source: ${{ fromJson(needs.resolve.outputs.sources) }}
        # Source → script path mapping is done in the bash script below
        # (NOT via `include:`). Reason: `include:` entries that don't
        # match the dynamic `source` axis get ADDED as new combinations
        # by GH Actions — so an include for {source: glassnode, script: X}
        # creates a glassnode job EVEN WHEN we asked for gdelt only. The
        # bash-side case statement avoids that footgun entirely.
    steps:
      - name: Run ${{ matrix.source }} backfill on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: botuser
          key: ${{ secrets.VPS_SSH_KEY }}
          # 30-min ceiling per backfill. GDELT first-week catch-up may
          # approach this; the wrapper's SIGHUP handler alerts before
          # SSH client tears down (appleboy/ssh-action timeout closes
          # the channel → SIGHUP, not SIGTERM).
          command_timeout: 30m
          # Pass GitHub repo secrets as env vars to the SSH session.
          # Avoids putting them in VPS .env (so the secret lives only
          # in GitHub's encrypted secret store + ephemeral runner env).
          envs: CC_API_KEY_FROM_SECRET
          # `envs:` exports the named env vars from the runner into the
          # remote shell. The runner-side env is set via the env: block
          # below. We map secrets.CRYPTOCOMPARE_API_KEY → an env var
          # the SSH script then re-exports under the name the script
          # expects (CRYPTOCOMPARE_API_KEY).
          script: |
            set -euo pipefail
            cd ~/kalshi-bot-repo
            # Source → backfill script mapping. Fail-loud on unknown
            # source (catches typos in the resolve step's case dispatch).
            case "${{ matrix.source }}" in
              gdelt)         BACKFILL_SCRIPT="scripts/backfill/gdelt_backfill.py" ;;
              glassnode)     BACKFILL_SCRIPT="scripts/backfill/glassnode_backfill.py" ;;
              cryptocompare) BACKFILL_SCRIPT="scripts/backfill/cryptocompare_news_backfill.py" ;;
              *)
                echo "ERROR: unknown source '${{ matrix.source }}' — update the case statement" >&2
                exit 1
                ;;
            esac
            # Extract specific .env vars instead of `source .env` — avoids
            # `set -u` tripping on unset references AND avoids shell-
            # evaluating arbitrary .env content (defense-in-depth).
            grep_env() { grep -E "^$1=" .env 2>/dev/null | head -1 | cut -d= -f2- | sed 's/^"//; s/"$//'; }
            export TELEGRAM_BOT_TOKEN="$(grep_env TELEGRAM_BOT_TOKEN)"
            export TELEGRAM_CHAT_ID="$(grep_env TELEGRAM_CHAT_ID)"
            export GLASSNODE_API_KEY="$(grep_env GLASSNODE_API_KEY)"
            # Re-export the GH-secret-injected CC key under the name the
            # python script reads. Empty string treated by script as unset.
            export CRYPTOCOMPARE_API_KEY="${CC_API_KEY_FROM_SECRET:-}"
            echo "Running ${{ matrix.source }} backfill: $BACKFILL_SCRIPT"
            venv/bin/python3 scripts/ops/h4_run_with_alert.py \
              --label ${{ matrix.source }} \
              -- venv/bin/python3 "$BACKFILL_SCRIPT" --db state.db
        env:
          CC_API_KEY_FROM_SECRET: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
